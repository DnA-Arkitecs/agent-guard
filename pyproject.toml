[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "agent-guard"
version = "1.1.0"
description = "Deterministic pre-execution security firewall for autonomous AI agents (PreToolUse hook)."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "DnA Arkitecs" }]
dependencies = []

[project.optional-dependencies]
test = ["pytest>=7"]

[project.scripts]
agent-guard = "agent_guard.cli:main"

[tool.setuptools]
packages = ["agent_guard"]

[tool.pytest.ini_options]
testpaths = ["."]
addopts = "-q"
